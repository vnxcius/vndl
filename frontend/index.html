<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vndl — privacy-first video & audio downloader</title>
    <meta
      name="description"
      content="Download video and audio from YouTube, Twitter/X, TikTok and Instagram. No accounts, no tracking, nothing stored server-side."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://dl.vncius.dev/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="vndl" />
    <meta property="og:title" content="vndl — privacy-first video & audio downloader" />
    <meta
      property="og:description"
      content="Download video and audio from YouTube, Twitter/X, TikTok and Instagram. No accounts, no tracking, nothing stored server-side."
    />
    <meta property="og:url" content="https://dl.vncius.dev/" />
    <meta property="og:image" content="https://dl.vncius.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="vndl — privacy-first video & audio downloader" />
    <meta
      name="twitter:description"
      content="Download video and audio from YouTube, Twitter/X, TikTok and Instagram. No accounts, no tracking, nothing stored server-side."
    />
    <meta name="twitter:image" content="https://dl.vncius.dev/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "vndl",
        "url": "https://dl.vncius.dev/",
        "description": "Privacy-first video and audio downloader for YouTube, Twitter/X, TikTok and Instagram. No accounts, no tracking, nothing stored server-side.",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Any",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>

    <script>
      (function () {
        try {
          var stored = localStorage.getItem("vndl-theme");
          var theme = stored === "light" || stored === "dark" ? stored : "system";
          var isDark =
            theme === "dark" ||
            (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", isDark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
