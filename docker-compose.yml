# Pinned so CI and manual deploys always operate on the same project,
# regardless of the invoking directory.
name: vndl

services:
  backend:
    build: ./backend
    # Not published to the host — Caddy is the only intended entry point.
    # The backend trusts X-Forwarded-For for rate limiting, which only
    # holds if the backend port itself is never directly reachable. Need
    # local debugging access? Add a docker-compose.override.yml instead.
    # Every value can be overridden from the root .env — see .env.example.
    environment:
      PORT: "8080" # fixed: Caddy proxies to backend:8080
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:${FRONTEND_PORT:-8081}}"
      RATE_LIMIT_RPS: "${RATE_LIMIT_RPS:-1}"
      RATE_LIMIT_BURST: "${RATE_LIMIT_BURST:-5}"
      MAX_CONCURRENT_YTDLP: "${MAX_CONCURRENT_YTDLP:-6}"
      CONCURRENCY_MAX_WAIT: "${CONCURRENCY_MAX_WAIT:-15s}"
      MAX_JOBS_PER_IP: "${MAX_JOBS_PER_IP:-2}"
      MAX_JOB_DURATION: "${MAX_JOB_DURATION:-30m}"
      MAX_FILESIZE: "${MAX_FILESIZE:-2G}"
      MAX_SSE_CONNECTIONS: "${MAX_SSE_CONNECTIONS:-512}"
      JOB_TTL: "${JOB_TTL:-5m}"
      PROBE_CACHE_TTL: "${PROBE_CACHE_TTL:-10m}"
      LOG_FORMAT: "${LOG_FORMAT:-text}"
      LOG_DIR: "/var/log/vndl" # fixed: container side of the LOGS_DIR mount below
      LOG_RETENTION_DAYS: "${LOG_RETENTION_DAYS:-30}"
    volumes:
      - ${LOGS_DIR:-./logs}:/var/log/vndl
    init: true # reaps yt-dlp/ffmpeg children the server doesn't wait on
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: ${BACKEND_MEM_LIMIT:-2g}
    cpus: ${BACKEND_CPUS:-2}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ""
    # Loopback only: the backend trusts CF-Connecting-IP, so Caddy must be
    # reachable solely through cloudflared on this host. Set FRONTEND_BIND
    # to 0.0.0.0 only if cloudflared runs elsewhere and the port is firewalled.
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-8081}:80"
    depends_on:
      - backend
    restart: unless-stopped
