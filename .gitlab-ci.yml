# Deploys to the home server on every push to main, via a self-hosted
# runner (tag: home-server) — see README.md for one-time setup.
stages:
  - deploy

deploy:
  stage: deploy
  tags:
    - home-server
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  variables:
    GIT_CLEAN_FLAGS: -ffdx -e .env -e logs/ # keep .env and log history across deploys
    # Host path of the env file to deploy with. This job runs in the runner's
    # own checkout, so point it at a fixed file via Settings → CI/CD → Variables.
    VNDL_ENV_FILE: .env
  resource_group: home-server-deploy # only one deploy at a time
  script:
    # Exported vars take precedence over any .env in this checkout.
    - >
      if test -f "$VNDL_ENV_FILE"; then set -a; . "$VNDL_ENV_FILE"; set +a; echo "using env file $VNDL_ENV_FILE";
      else echo "WARNING: env file $VNDL_ENV_FILE not found, deploying with defaults"; fi
    - docker compose up -d --build
    - docker image prune -f
    # --retry-all-errors, not --retry-connrefused: the published port can
    # accept a connection just before Caddy is ready, surfacing as a reset.
    - >
      curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-all-errors
      "http://127.0.0.1:${FRONTEND_PORT:-8081}/api/health"
